<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPC 群聊接入示例</title><style>body{font:16px/1.7 system-ui;background:#f4f7f5;color:#183c2a;margin:0;padding:32px}main{max-width:700px;margin:auto}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #abc2b3;border-radius:8px}button{padding:12px 20px;background:#176447;color:white;border:0;border-radius:8px;margin-top:16px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}#status{color:#a33}</style></head><body><main><h1>把项目群聊放进 DApp</h1><p>输入已有 GPC 群地址，加载右下角的聊天入口。连接与签名由当前钱包完成，项目方可在加载前执行自己的合约资格判断。</p><label for="group">群地址</label><input id="group" placeholder="0x…" autocomplete="off"><button id="mount">加载群聊</button><p id="status" role="alert"></p><pre>const chat = GPCChat.init({
  groupId: '0x群地址',
  provider: connectedWalletProvider,
});
chat.open();
// 离开页面或资格失效时：chat.destroy();</pre><p>该示例不会自动发起交易。入群可能需要矿工费或群设置的费用，请核对钱包确认内容。</p></main><script src="./chat-widget.js"></script><script>document.getElementById('group').value=new URLSearchParams(location.search).get('groupId')||'';document.getElementById('mount').onclick=function(){try{GPCChat.init({groupId:document.getElementById('group').value.trim(),provider:window.ethereum}).open();document.getElementById('status').textContent=''}catch(error){document.getElementById('status').textContent=error.message}};</script></body></html>
